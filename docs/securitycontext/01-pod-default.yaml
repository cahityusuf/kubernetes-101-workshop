# Hiç SecurityContext tanımlanmamış default Pod.
# Çoğu image (busybox dahil) root olarak çalışır — kök dosya sistemi yazılabilir,
# tam capability seti var. Üretim için TEHLİKELİDİR; karşılaştırma amacıyla burada.

apiVersion: v1
kind: Pod
metadata:
  name: default-pod
  labels:
    demo: securitycontext
spec:
  containers:
  - name: app
    image: busybox:1.36
    command: ["sh", "-c", "sleep 3600"]
