# ClusterRole + ClusterRoleBinding — tüm namespace'lerde Pod listeleme izni
# (kıyaslama: 02-role-rolebinding.yaml sadece 'default' namespace'inde geçerli)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-pod-reader
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: reader-sa-can-read-pods-everywhere
subjects:
- kind: ServiceAccount
  name: reader-sa
  namespace: default
roleRef:
  kind: ClusterRole
  name: cluster-pod-reader
  apiGroup: rbac.authorization.k8s.io
