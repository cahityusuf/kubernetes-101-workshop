# Toleration'ı OLMAYAN Pod. minikube-m02'de
#   workload=gpu:NoSchedule
# taint'i varken bu Pod o Node'a yerleştirilemez. Scheduler m01 veya m03'e koyar.

apiVersion: v1
kind: Pod
metadata:
  name: plain-pod
  labels:
    demo: taint-toleration
spec:
  containers:
  - name: app
    image: busybox:1.36
    command: ["sh", "-c", "sleep 3600"]
