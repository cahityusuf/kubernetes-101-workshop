# Exists operatörü: value KONTROL EDİLMEZ — sadece key'in (ve effect'in) var olması yeter.
# Aynı key'le farklı value'lara sahip birden çok taint varsa hepsini tolere eder.
#
# Örnek kullanım: "workload=gpu" da olsa "workload=ml" de olsa kabul et.

apiVersion: v1
kind: Pod
metadata:
  name: exists-tolerated
  labels:
    demo: taint-toleration
spec:
  tolerations:
  - key: "workload"
    operator: "Exists"            # value alanı YAZILMAZ
    effect: "NoSchedule"
  containers:
  - name: app
    image: busybox:1.36
    command: ["sh", "-c", "sleep 3600"]
