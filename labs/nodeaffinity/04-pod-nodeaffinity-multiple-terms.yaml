# nodeSelectorTerms listesi → OR mantığı (bir term yeterli)
# Bir term içindeki matchExpressions listesi → AND mantığı (hepsi tutmalı)
#
# Bu örnek: "(disk=ssd VE arch=amd64) VEYA (workload=gpu)" anlamına gelir.

apiVersion: v1
kind: Pod
metadata:
  name: multi-terms
  labels:
    demo: nodeaffinity
spec:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        # Term 1: AND
        - matchExpressions:
          - { key: disk,                operator: In, values: ["ssd"] }
          - { key: kubernetes.io/arch,  operator: In, values: ["amd64"] }
        # Term 2: OR ile
        - matchExpressions:
          - { key: workload, operator: In, values: ["gpu"] }
  containers:
  - name: app
    image: busybox:1.36
    command: ["sh", "-c", "sleep 3600"]
