apiVersion: apps/v1
kind: Deployment
metadata:
  name: probe-demo
  labels:
    app: probe-demo
spec:
  replicas: 3
  selector:
    matchLabels:
      app: probe-demo
  template:
    metadata:
      labels:
        app: probe-demo
    spec:
      containers:
      - name: app
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          touch /tmp/healthy /tmp/ready
          # Basit HTTP yerine exec probe kullanıyoruz
          while true; do sleep 1; done
        startupProbe:
          exec:
            command: ["sh", "-c", "test -f /tmp/healthy"]
          failureThreshold: 10
          periodSeconds: 2
        livenessProbe:
          exec:
            command: ["sh", "-c", "test -f /tmp/healthy"]
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          exec:
            command: ["sh", "-c", "test -f /tmp/ready"]
          periodSeconds: 5
          failureThreshold: 2
