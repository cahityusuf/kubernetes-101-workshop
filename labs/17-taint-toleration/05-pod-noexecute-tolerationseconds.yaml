# NoExecute davranışı: Pod taint'i tolere etse bile tolerationSeconds dolunca
# tahliye edilir. tolerationSeconds belirtilmezse Pod sonsuza dek kalır.
#
# Pratik kullanım: Node Not Ready'ye düşünce K8s otomatik olarak
# 'node.kubernetes.io/not-ready:NoExecute' taint'ini koyar; Pod'larda
# default 300 sn tolerationSeconds vardır (default-toleration-seconds
# admission plugin'i sayesinde).

apiVersion: v1
kind: Pod
metadata:
  name: evict-test
  labels:
    demo: taint-toleration
spec:
  tolerations:
  - key: "workload"
    operator: "Equal"
    value: "gpu"
    effect: "NoExecute"
    tolerationSeconds: 60         # 60 sn sonra evict
  containers:
  - name: app
    image: busybox:1.36
    command: ["sh", "-c", "sleep 3600"]
