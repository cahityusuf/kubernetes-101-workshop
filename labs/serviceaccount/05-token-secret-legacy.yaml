# K8s 1.24+ otomatik token Secret yaratmaz. CI/CD veya external entegrasyon için
# kalıcı token gerekiyorsa aşağıdaki gibi MANUEL olarak Secret oluşturulur.
#
# Türü 'kubernetes.io/service-account-token' olmak ZORUNDA. Token bu Secret
# içine controller tarafından otomatik yazılır.
#
# Kullanmak için:
#   kubectl apply -f 05-token-secret-legacy.yaml
#   kubectl get secret reader-sa-token -o jsonpath='{.data.token}' | base64 -d
#
# UYARI: bu token uzun ömürlüdür ve rotate edilmez. Yalnızca gerçekten gerekliyse
# kullanın. Modern alternatifler: TokenRequest API, OIDC federation.

apiVersion: v1
kind: Secret
metadata:
  name: reader-sa-token
  namespace: default
  annotations:
    kubernetes.io/service-account.name: reader-sa
type: kubernetes.io/service-account-token
