# backend Pod'una sadece tier=frontend etiketli Pod'lardan port 5678 üzerinden
# erişime izin verir. 01-deny-all-ingress.yaml ile birlikte uygulanır — birden çok
# NetworkPolicy birlikte değerlendirilir (mantıksal OR / additive).

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-to-backend
spec:
  podSelector:
    matchLabels:
      tier: backend
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          tier: frontend
    ports:
    - protocol: TCP
      port: 5678
