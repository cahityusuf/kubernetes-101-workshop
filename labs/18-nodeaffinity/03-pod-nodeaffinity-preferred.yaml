# Soft rule: preferred... blok'u eşleşmezse Pod yine de yerleştirilir.
# weight (1-100): birden çok tercih varsa toplanır; en yüksek skorlu Node seçilir.

apiVersion: v1
kind: Pod
metadata:
  name: soft-rule
  labels:
    demo: nodeaffinity
spec:
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 80                    # en güçlü tercih
        preference:
          matchExpressions:
          - { key: disk, operator: In, values: ["ssd"] }
      - weight: 20                    # ikincil tercih
        preference:
          matchExpressions:
          - { key: workload, operator: In, values: ["gpu"] }
  containers:
  - name: app
    image: busybox:1.36
    command: ["sh", "-c", "sleep 3600"]
