apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: k8s-playground
  name: k8s-playground
  namespace: cahit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8s-playground
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: k8s-playground
    spec:
      volumes:
        # Node üzerindeki dizin; pod hangi node'da çalışıyorsa o node'un bu path'i kullanılır
        - name: logs
          hostPath:
            path: /var/log/data
            type: DirectoryOrCreate  # Yoksa node'da oluşturulur
      containers:
      - image: docker.io/cahityusuf/k8s-playground:v1.0.0
        imagePullPolicy: IfNotPresent
        name: k8s-playground
        resources: {}
        volumeMounts:
          # Uygulamanın "logs" yazdığı dizin (gerekirse /app/logs veya working dir'e göre değiştir)
          - name: logs
            mountPath: /data
