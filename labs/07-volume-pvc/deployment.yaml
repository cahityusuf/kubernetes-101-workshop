# =============================================================================
# LAB 07 — VOLUME & PVC (Kalıcı Depolama)
# =============================================================================
# Konu: emptyDir vs PersistentVolumeClaim farkı.
#   - emptyDir → Pod yaşam döngüsüne bağlıdır; Pod silinirse içerik kaybolur.
#   - PVC      → Pod silinse bile node'da bağlı PV korunur; aynı ad ile gelen
#                Pod aynı diski yeniden bind eder.
#
# Bu deployment'ta /data PVC'den, /scratch emptyDir'den geliyor — ikisini
# /Storage ve /Storage/Upload üzerinden test edebilirsiniz.
#
# Önemli: PVC RWO olduğu için 'replicas: 1' + 'strategy: Recreate'.
# Aksi hâlde ikinci Pod 'MultiAttachError' alır.
#
# Uygula:
#   kubectl apply -f pvc.yaml
#   kubectl apply -f deployment.yaml
#
# Test akışı:
#   1) Yükleyip dosyanın diskte olduğunu doğrula:
#      kubectl port-forward deploy/pvc-demo 8080:8080
#      # http://localhost:8080/Storage → "Dosya yükle" formundan yükle
#      kubectl exec deploy/pvc-demo -- ls -la /data/uploads
#
#   2) Pod'u öldür; yeni Pod gelene kadar bekle:
#      kubectl delete pod -l app=pvc-demo
#      kubectl get pod -l app=pvc-demo -w
#
#   3) Aynı dosyanın hâlâ orada olduğunu kanıtla:
#      kubectl exec deploy/pvc-demo -- ls -la /data/uploads
#
#   4) emptyDir farkı: /scratch'a yazıp Pod'u sil → boş gelir.
#      kubectl exec deploy/pvc-demo -- sh -c 'echo x > /scratch/x.txt && ls /scratch'
#      kubectl delete pod -l app=pvc-demo
#      kubectl exec deploy/pvc-demo -- ls /scratch
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pvc-demo
  namespace: storage
  labels:
    app: pvc-demo
    lab: "07-volume-pvc"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pvc-demo
  template:
    metadata:
      labels:
        app: pvc-demo
    spec:
      containers:
        - name: web
          image: docker.io/cahityusuf/k8s-playground:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080

          volumeMounts:
            - name: data           # PVC — kalıcı
              mountPath: /data

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data        # 05-volume-pvc/pvc.yaml içindeki PVC adı
