# =============================================================================
# LAB 12 — HORIZONTAL POD AUTOSCALER (HPA) — DEPLOYMENT
# =============================================================================
# Konu: HPA'nın CPU kullanımına göre Pod replikalarını OTOMATİK ölçeklendirmesi.
#
# Bu lab İKİ dosyadan oluşur ve sıra önemlidir:
#   1) deployment.yaml  ← bu dosya  (önce uygulanır)
#   2) hpa.yaml         ← bir sonraki adım (Deployment hazır olduktan sonra)
#
# HPA'nın çalışması için olmazsa olmaz şartlar:
#   ✓ Kümede 'metrics-server' kurulu olmalı  (bkz. README.md → Adım 1)
#   ✓ Container 'resources.requests.cpu' tanımlı olmalı  (HPA hedefi % cinsindendir)
#   ✓ Deployment STATELESS olmalı (RWO PVC olursa MultiAttachError; bu lab emptyDir)
#   ✓ replicas >= minReplicas (manifest'te 2; HPA aktifleştikten sonra HPA yönetir)
#
# Uygula:
#   kubectl apply -f deployment.yaml
#   kubectl -n hpa-demo get pod -w
#
# CPU isteğini doğrula (HPA'nın hesabı için kritik):
#   kubectl -n hpa-demo describe pod -l app=hpa-demo | grep -A 1 'Requests'
# =============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: hpa-demo
  labels:
    lab: "12-hpa"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hpa-demo
  namespace: hpa-demo
  labels:
    app: hpa-demo
    lab: "12-hpa"
spec:
  # İlk apply'da 2 replika oluşur. HPA aktifleştikten sonra REPLICAS alanını
  # HPA yönetir; bu değer artık yalnızca 'minReplicas'a değil, mevcut yüke göre
  # değişir. HPA olmadan çalıştırırsanız sabit 2 replika kalır.
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: hpa-demo
  template:
    metadata:
      labels:
        app: hpa-demo
    spec:
      terminationGracePeriodSeconds: 20
      containers:
        - name: web
          image: docker.io/cahityusuf/k8s-playground:v1.0.1
          # Eğitim sırasında aynı tag yenilenebilir; Always politikası
          # node'da kalan eski cache'i atlatır (üretimde IfNotPresent + immutable tag).
          imagePullPolicy: Always
          ports:
            - { name: http, containerPort: 8080 }

          readinessProbe:
            httpGet: { path: /healthz/ready, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz/live, port: http }
            periodSeconds: 10
            failureThreshold: 3

          # -----------------------------------------------------------------
          # HPA'nın YIIDIZI: resources.requests
          # HPA % hesabını ŞU ŞEKİLDE yapar:
          #   utilization = (pod_avg_cpu_usage_mCPU / requests.cpu_mCPU) * 100
          # Yani 'request' küçükse % yüksek görünür; HPA daha kolay tetiklenir.
          # Bu demoda request=100m, target=%60 → eşik ortalama 60m CPU.
          # -----------------------------------------------------------------
          resources:
            requests:
              cpu: "100m"          # HPA'nın referans aldığı taban
              memory: "128Mi"
            limits:
              cpu: "500m"          # Tek Pod'un üretebileceği maksimum
              memory: "256Mi"

          env:
            - name: APP_VERSION
              value: "1.0.1-hpa"
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }

          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp,  mountPath: /tmp }

          # readOnlyRootFilesystem ile birlikte /tmp ve /data yazılabilir kalır
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }

      # emptyDir → HPA çoklu replikası için olmazsa olmaz (RWO PVC kullanma!)
      volumes:
        - { name: data, emptyDir: {} }
        - { name: tmp,  emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: hpa-demo
  namespace: hpa-demo
  labels:
    app: hpa-demo
spec:
  type: ClusterIP
  selector:
    app: hpa-demo
  ports:
    - { name: http, port: 80, targetPort: http, protocol: TCP }
