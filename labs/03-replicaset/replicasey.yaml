apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: nginx
  labels:
    app: guestbook
    tier: nginx
spec:
  # modify replicas according to your case
  replicas: 2
  selector:
    matchLabels:
      tier: nginx
  template:
    metadata:
      labels:
        tier: nginx
    spec:
      containers:
      - name: nginx-container
        image: nginx:latest
