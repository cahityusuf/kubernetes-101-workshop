  apiVersion: networking.k8s.io/v1
  kind: Ingress
  metadata:
    name: k8s-playground-ingressss
    namespace: svc-test
  spec:
    ingressClassName: nginx
    rules:
      - host: k8s.aselsan.com
        http:
          paths:
            - pathType: Prefix
              backend:
                service:
                  name: k8s-test
                  port:
                    number: 80
              path: /